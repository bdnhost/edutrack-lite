<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שיעור פעיל - EduTrack Lite</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="session-container">

<div class="container">
  <div id="alertContainer"></div>

  <!-- Back Button -->
  <button class="btn btn-outline-dark mb-4 no-print" onclick="goBack()">
    <i class="bi bi-arrow-right me-2"></i>
    חזרה
  </button>

  <div class="row">
    <!-- QR Code Section -->
    <div class="col-lg-5 mb-4">
      <div class="qr-card">
        <h3 id="courseName" class="mb-2">טוען...</h3>
        <p class="text-muted" id="courseInfo"></p>
        
        <div class="qr-code-container" id="qrContainer">
          <div class="spinner-border text-primary" role="status"></div>
        </div>

        <!-- Timer -->
        <div class="timer" id="timer">--:--</div>
        <p class="text-muted">זמן נותר לסריקה</p>

        <!-- Stats -->
        <div class="attendance-stats">
          <div class="stat-box">
            <div class="number" id="attendedCount">0</div>
            <div class="label">נרשמו</div>
          </div>
          <div class="stat-box">
            <div class="number" id="totalStudents">0</div>
            <div class="label">סה"כ</div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress progress-custom">
          <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
        </div>
        <p class="text-center text-muted mb-3">
          <span id="percentage">0%</span> התקדמות
        </p>

        <!-- Close Button -->
        <button class="btn btn-danger btn-lg w-100 no-print" onclick="endSession()">
          <i class="bi bi-x-circle me-2"></i>
          סיים שיעור
        </button>
      </div>
    </div>

    <!-- Attendance List -->
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header bg-white">
          <h4 class="mb-0">
            <i class="bi bi-people me-2"></i>
            רשימת נוכחות
          </h4>
        </div>
        <div class="card-body">
          <div class="attendance-list" id="attendanceList">
            <div class="text-center text-muted py-5">
              <i class="bi bi-hourglass-split" style="font-size: 3rem; opacity: 0.3;"></i>
              <p class="mt-3">ממתין לסריקות...</p>
              <small>התלמידים יופיעו כאן ברגע שיסרקו את ה-QR</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/main.js"></script>

<script>
let sessionId = null;
let courseId = null;
let timerInterval = null;
let refreshInterval = null;
let expiresAt = null;

$(document).ready(function() {
  requireAuth(function() {
    // Get session ID or course ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    sessionId = urlParams.get('id');
    courseId = urlParams.get('course');

    // If session ID is provided, load existing session
    if (sessionId) {
      loadExistingSession();
    } else if (courseId) {
      // Start new session
      initSession();
    } else {
      showAlert('חסר מזהה קורס או שיעור', 'danger');
      setTimeout(() => window.location.href = 'index.html', 2000);
      return;
    }
  });
});

function loadExistingSession() {
  console.log('🔄 Loading existing session:', sessionId);

  getSession(sessionId)
    .done(function(response) {
      console.log('✅ Session loaded:', response);
      const session = response.data || response;

      if (!session || !session.id) {
        console.error('❌ Invalid session data:', session);
        showAlert('שגיאה: נתוני שיעור לא תקינים', 'danger');
        return;
      }

      courseId = session.course_id;
      expiresAt = new Date(session.expires_at);

      // Update UI
      $('#courseName').text(session.course_name);
      $('#courseInfo').text(session.institution_name || '');
      $('#totalStudents').text(session.student_count || 0);

      // Generate QR Code
      const url = window.location.origin + window.location.pathname.replace('session.html', 'attend.html') + '?token=' + session.token;
      console.log('QR URL:', url);

      $('#qrContainer').html('');
      new QRCode(document.getElementById('qrContainer'), {
        text: url,
        width: 280,
        height: 280,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      // Start timer
      startTimer();

      // Load attendance
      loadAttendance();

      // Auto-refresh every 3 seconds
      refreshInterval = setupAutoRefresh(loadAttendance, 3000);
    })
    .fail(function(xhr, status, error) {
      console.error('❌ Failed to load session:', error);
      showAlert('שגיאה בטעינת השיעור', 'danger');
      setTimeout(() => window.location.href = 'index.html', 2000);
    });
}

function initSession() {
  console.log('🚀 initSession started for course:', courseId);

  // Load course info
  getCourse(courseId)
    .done(function(response) {
      console.log('✅ Course loaded:', response);
      const course = response.data || response;
      $('#courseName').text(course.name);
      $('#courseInfo').text(course.institution_name + ' • ' + course.semester);
      $('#totalStudents').text(course.student_count || 0);
    })
    .fail(function(xhr, status, error) {
      console.error('❌ Failed to load course:', error);
      showAlert('שגיאה בטעינת הקורס: ' + error, 'danger');
    });

  // Start or get active session
  console.log('📤 Starting session...');
  startSession(courseId)
    .done(function(response) {
      console.log('✅ Session started:', response);
      const session = response.data || response;

      if (!session || !session.id) {
        console.error('❌ Invalid session data:', session);
        showAlert('שגיאה: נתוני שיעור לא תקינים', 'danger');
        return;
      }

      sessionId = session.id;
      expiresAt = new Date(session.expires_at);

      console.log('📱 Generating QR Code...');
      console.log('Token:', session.token);

      // Generate QR Code
      const url = window.location.origin + window.location.pathname.replace('session.html', 'attend.html') + '?token=' + session.token;
      console.log('QR URL:', url);

      $('#qrContainer').html('');
      new QRCode(document.getElementById('qrContainer'), {
        text: url,
        width: 280,
        height: 280,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      console.log('✅ QR Code generated');

      // Start timer
      startTimer();

      // Load attendance
      loadAttendance();

      // Auto-refresh every 3 seconds
      refreshInterval = setupAutoRefresh(loadAttendance, 3000);
    })
    .fail(function(xhr, status, error) {
      console.error('❌ Failed to start session:', {
        status: xhr.status,
        statusText: xhr.statusText,
        responseText: xhr.responseText,
        error: error
      });

      let errorMsg = 'שגיאה בהתחלת השיעור';
      try {
        const response = JSON.parse(xhr.responseText);
        errorMsg = response.message || response.error || errorMsg;
      } catch(e) {
        errorMsg += ': ' + xhr.statusText;
      }

      showAlert(errorMsg, 'danger');
      setTimeout(() => window.location.href = 'index.html', 2000);
    });
}

function startTimer() {
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  const remaining = calculateTimeRemaining(expiresAt);
  
  if (remaining.total <= 0) {
    clearInterval(timerInterval);
    showAlert('חלון הנוכחות נסגר', 'warning');
    $('#timer').text('00:00').removeClass('warning').addClass('danger');
    return;
  }
  
  const timeStr = formatTimeRemaining(remaining.minutes, remaining.seconds);
  $('#timer').text(timeStr);
  
  // Change color based on time
  if (remaining.total <= 300) { // 5 minutes
    $('#timer').addClass('warning');
  }
  if (remaining.total <= 60) { // 1 minute
    $('#timer').removeClass('warning').addClass('danger');
  }
}

function loadAttendance() {
  if (!sessionId) return;
  
  getSessionAttendance(sessionId)
    .done(function(response) {
      const records = response.data || response;
      
      $('#attendedCount').text(records.length);
      
      const total = parseInt($('#totalStudents').text()) || 1;
      const percentage = Math.round((records.length / total) * 100);
      $('#percentage').text(percentage + '%');
      $('#progressBar').css('width', percentage + '%');
      
      if (records.length === 0) {
        $('#attendanceList').html(`
          <div class="text-center text-muted py-5">
            <i class="bi bi-hourglass-split" style="font-size: 3rem; opacity: 0.3;"></i>
            <p class="mt-3">ממתין לסריקות...</p>
            <small>התלמידים יופיעו כאן ברגע שיסרקו את ה-QR</small>
          </div>
        `);
        return;
      }
      
      let html = '';
      records.forEach(record => {
        html += `
          <div class="attendance-item">
            <div class="student-info">
              <i class="bi bi-check-circle-fill check-icon"></i>
              <div>
                <div class="student-name">${record.first_name} ${record.last_name}</div>
                <div class="student-phone">${formatPhone(record.phone)}</div>
              </div>
            </div>
            <div class="timestamp">
              ${formatTime(record.timestamp)}
            </div>
          </div>
        `;
      });
      
      $('#attendanceList').html(html);
    });
}

function endSession() {
  if (!confirm('האם אתה בטוח שברצונך לסיים את השיעור?')) {
    return;
  }
  
  if (!sessionId) {
    console.error('❌ No session ID!');
    showAlert('שגיאה: אין מזהה שיעור', 'danger');
    return;
  }
  
  console.log('🛑 Closing session:', sessionId);
  closeSession(sessionId)
    .done(function() {
      clearInterval(timerInterval);
      clearInterval(refreshInterval);
      showAlert('השיעור נסגר בהצלחה', 'success');
      setTimeout(() => window.location.href = 'course.html?id=' + courseId, 1500);
    })
    .fail(function(xhr) {
      const error = xhr.responseJSON?.error || 'שגיאה בסגירת השיעור';
      showAlert(error, 'danger');
    });
}

function goBack() {
  if (confirm('האם אתה בטוח? השיעור ימשיך לפעול ברקע')) {
    window.location.href = 'course.html?id=' + courseId;
  }
}

// Cleanup on page unload
$(window).on('beforeunload', function() {
  if (timerInterval) clearInterval(timerInterval);
  if (refreshInterval) clearInterval(refreshInterval);
});
</script>

</body>
</html>
