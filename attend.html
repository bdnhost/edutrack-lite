<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רישום נוכחות - EduTrack Lite</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="attend-container default" id="container">
  <div class="attend-card" id="card">
    <!-- Loading State -->
    <div id="loadingState">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p>טוען...</p>
    </div>

    <!-- Main Form (hidden initially) -->
    <div id="formState" style="display: none;">
      <div class="text-center mb-4">
        <i class="bi bi-book-fill text-primary" style="font-size: 3rem;"></i>
      </div>
      
      <h2 class="mb-2" id="courseName">טוען...</h2>
      <p class="text-muted mb-4" id="courseInfo"></p>

      <form id="attendForm">
        <div class="mb-4">
          <label for="phone" class="form-label h5">הזן את מספר הטלפון שלך</label>
          <input 
            type="tel" 
            class="form-control phone-input" 
            id="phone" 
            placeholder="05X-XXX-XXXX"
            maxlength="15"
            required
            autofocus
          >
          <small class="text-muted d-block text-center mt-2">
            10 ספרות המתחיל ב-0
          </small>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          <i class="bi bi-check-circle me-2"></i>
          אשר נוכחות
        </button>
      </form>

      <p class="text-muted text-center mt-4 mb-0">
        <small>יש בעיה? פנה למרצה</small>
      </p>
    </div>

    <!-- Success State (hidden initially) -->
    <div id="successState" style="display: none;">
      <i class="bi bi-check-circle-fill success-icon"></i>
      <h1 class="display-4 mb-3">נוכחות נרשמה! ✓</h1>
      <p class="h4 mb-3">שלום <span id="studentName"></span></p>
      <p class="text-muted mb-4">נרשמת בשיעור בהצלחה</p>
      <div class="text-muted">
        <i class="bi bi-clock me-1"></i>
        <span id="successTime"></span>
      </div>
    </div>

    <!-- Error State (hidden initially) -->
    <div id="errorState" style="display: none;">
      <i class="bi bi-x-circle-fill error-icon"></i>
      <h2 class="mb-3">שגיאה</h2>
      <p class="text-danger mb-4" id="errorMessage"></p>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

<script>
let token = null;
let sessionInfo = null;

$(document).ready(function() {
  // Get token from URL
  const urlParams = new URLSearchParams(window.location.search);
  token = urlParams.get('token');
  
  if (!token) {
    showError('קישור לא תקין');
    return;
  }
  
  // Check session
  checkSessionToken(token)
    .done(function(response) {
      sessionInfo = response.data || response;
      
      $('#courseName').text(sessionInfo.course_name);
      $('#courseInfo').text(sessionInfo.institution_name);
      
      // Show form
      $('#loadingState').hide();
      $('#formState').show();
    })
    .fail(function(xhr) {
      const error = xhr.responseJSON?.error || 'שיעור לא נמצא או הסתיים';
      showError(error);
    });
  
  // Handle form submission
  $('#attendForm').on('submit', function(e) {
    e.preventDefault();
    
    const phone = $('#phone').val();
    
    // Validate phone
    if (!isValidPhone(phone)) {
      alert('מספר טלפון לא תקין. נדרש 10 ספרות המתחיל ב-0');
      return;
    }
    
    // Disable form
    $('#attendForm button').prop('disabled', true).html(`
      <span class="spinner-border spinner-border-sm me-2"></span>
      בודק...
    `);
    
    // Register attendance
    registerAttendance(token, phone)
      .done(function(response) {
        const data = response.data || response;
        showSuccess(data.student_name);
      })
      .fail(function(xhr) {
        const error = xhr.responseJSON?.error || 'שגיאה ברישום נוכחות';
        showError(error);
      });
  });
});

function showSuccess(studentName) {
  $('#container').removeClass('default error').addClass('success');
  $('#formState').hide();
  $('#studentName').text(studentName);
  $('#successTime').text(formatTime(new Date()));
  $('#successState').show();
}

function showError(message) {
  $('#container').removeClass('default success').addClass('error');
  $('#loadingState').hide();
  $('#formState').hide();
  $('#errorMessage').text(message);
  $('#errorState').show();
}
</script>

</body>
</html>
