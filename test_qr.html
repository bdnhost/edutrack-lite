<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת QR Code</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    #qrcode { margin: 20px auto; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔍 בדיקת QR Code</h1>
  <hr>

  <div class="card mb-3">
    <div class="card-body">
      <h5>בדיקה 1: טעינת ספריית QRCode</h5>
      <p id="libraryStatus">בודק...</p>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h5>בדיקה 2: יצירת QR Code</h5>
      <button class="btn btn-primary" onclick="generateQR()">צור QR Code</button>
      <div id="qrcode" style="margin-top: 20px;"></div>
      <p id="qrStatus"></p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5>בדיקה 3: קריאה ל-API</h5>
      <input type="number" class="form-control mb-2" id="courseId" placeholder="מספר קורס" value="2">
      <button class="btn btn-success" onclick="testAPI()">בדוק API</button>
      <pre id="apiResult" style="margin-top: 10px; background: #f5f5f5; padding: 10px;"></pre>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const API_BASE = 'api/';

// בדיקה 1: האם הספרייה נטענה
$(document).ready(function() {
  if (typeof QRCode !== 'undefined') {
    $('#libraryStatus').html('<span class="text-success">✅ ספריית QRCode נטענה בהצלחה!</span>');
  } else {
    $('#libraryStatus').html('<span class="text-danger">❌ ספריית QRCode לא נטענה!</span>');
  }
});

// בדיקה 2: יצירת QR
function generateQR() {
  try {
    $('#qrcode').html('');
    $('#qrStatus').html('<span class="text-info">יוצר QR Code...</span>');
    
    const qrcode = new QRCode(document.getElementById('qrcode'), {
      text: 'https://bdnhost.net/edutrack-lite/attend.html?token=TEST123',
      width: 280,
      height: 280,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    
    setTimeout(() => {
      $('#qrStatus').html('<span class="text-success">✅ QR Code נוצר בהצלחה!</span>');
    }, 500);
    
  } catch(e) {
    $('#qrStatus').html('<span class="text-danger">❌ שגיאה: ' + e.message + '</span>');
    console.error('QR Error:', e);
  }
}

// בדיקה 3: קריאה ל-API
function testAPI() {
  const courseId = $('#courseId').val();
  $('#apiResult').text('טוען...');
  
  $.ajax({
    url: API_BASE + 'session.php?action=start',
    method: 'POST',
    data: { course_id: courseId },
    dataType: 'json'
  })
  .done(function(response) {
    $('#apiResult').text(JSON.stringify(response, null, 2));
    console.log('✅ API Response:', response);
    
    // נסה ליצור QR עם הטוקן האמיתי
    if (response.data && response.data.token) {
      $('#qrcode').html('');
      const url = 'https://bdnhost.net/edutrack-lite/attend.html?token=' + response.data.token;
      
      new QRCode(document.getElementById('qrcode'), {
        text: url,
        width: 280,
        height: 280,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
      
      $('#qrStatus').html('<span class="text-success">✅ QR Code נוצר עם טוקן אמיתי!</span>');
    }
  })
  .fail(function(xhr, status, error) {
    $('#apiResult').text('Error: ' + error + '\n\n' + xhr.responseText);
    console.error('❌ API Error:', xhr);
  });
}
</script>

</body>
</html>
